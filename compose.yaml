services:
  backend:
    build:
      context: ./backend
    container_name: kartu-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - ./data/database/database.sqlite:/var/www/html/database/database.sqlite
      - ./data/storage:/var/www/html/storage/app/public
